# Nginx Configuration — Trinetra Digital Solution
# Architecture: Split frontend (main domain) from API (api subdomain)
# Frontend: trinetradigitalsolution.com/admin/* → serves React SPA
# Backend:  api.trinetradigitalsolution.com/api/* → proxies Node backend

upstream trinetra_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# ─── HTTP → HTTPS Redirect ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name trinetradigitalsolution.com www.trinetradigitalsolution.com;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.trinetradigitalsolution.com;
    return 301 https://$host$request_uri;
}

# ─── Block 1: Frontend — trinetradigitalsolution.com ─────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trinetradigitalsolution.com www.trinetradigitalsolution.com;

    ssl_certificate /etc/letsencrypt/live/api.trinetradigitalsolution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.trinetradigitalsolution.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    client_max_body_size 10M;

    root /var/www/trinetra/dist;
    index index.html;

    # Static assets with aggressive caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Video assets with range request support
    location /videos/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Accept-Ranges bytes;
        access_log off;
        try_files $uri =404;
    }

    # SPA Fallback — CRITICAL: enables browser refresh on all /admin/* routes
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https:; connect-src 'self' https:;" always;
    }
}

# ─── Block 2: API Backend — api.trinetradigitalsolution.com ──────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.trinetradigitalsolution.com;

    ssl_certificate /etc/letsencrypt/live/api.trinetradigitalsolution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.trinetradigitalsolution.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # Block all non-API requests — no React pages served here
    location / {
        return 403 '{"error":"This endpoint only serves API requests. Access the CRM at https://trinetradigitalsolution.com/admin"}';
        add_header Content-Type application/json;
    }

    # All API traffic — proxy to Node backend
    location /api/ {
        proxy_pass http://trinetra_backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS headers for frontend on main domain
        add_header Access-Control-Allow-Origin "https://trinetradigitalsolution.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "https://trinetradigitalsolution.com";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
