name: Sync Supabase Migrations & Cron Worker on main

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "workers/trinetra-cron/**"
      - "tests/unit/**"
      - "src/lib/cloudflare/**"
      - "src/lib/cache/**"
      - "src/services/ai/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-sync.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript & Unit Tests
        run: |
          npm run test:unit
          npx tsc --noEmit

  sync-supabase:
    needs: verify
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_SUPABASE_CI == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push pending migrations to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN not configured in GitHub Secrets; skipping."
            exit 0
          fi
          npx supabase link --project-ref suvuvxdasccmztbbpreg
          npx supabase db push --include-all --yes

  deploy-cron-worker:
    needs: verify
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_CLOUDFLARE_CRON_CI == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy trinetra-cron Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 52ca2c75d5ee0677be20c4d1a1597859
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not configured in GitHub Secrets; skipping."
            exit 0
          fi
          npx wrangler deploy --config workers/trinetra-cron/wrangler.jsonc --env=""
